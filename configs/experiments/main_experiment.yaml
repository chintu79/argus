experiment:
  name: "budget_constrained_failure_discovery"
  experiment_id: "EXP001"
  description: "Budget-Constrained Adaptive Security Evaluation of AI Agents - Main Experiment"

# Research questions this experiment addresses
research_questions:
  - "RQ1: Under a fixed evaluation budget, does the state-branched adaptive method discover more distinct validated failure families than static, random, or unbranched adaptive baselines?"
  - "RQ2: What proportion of discovered failure families remain reproducible across independent verification runs?"
  - "RQ3: Do failure families discovered during search transfer to previously unseen holdout tasks/environments?"
  - "RQ4: Does state snapshotting reduce redundant prefix execution compared to unbranched adaptive testing?"

# Frozen protocol configuration (immutable after freeze)
protocol:
  version: "1.0"
  frozen_at: null  # Will be set at freeze time
  frozen_by: null

# Software version tracking
code_version:
  git_commit: null  # Auto-filled at freeze time
  working_tree_dirty: null  # Auto-filled at freeze time

# Budget configuration (matched across all methods)
budget:
  total_tokens: 500000
  token_categories:
    - agent_input_tokens
    - agent_output_tokens
    - tool_tokens
    - verification_tokens
    - snapshot_tokens
  accounting_rules:
    - "estimated_tokens and actual_tokens tracked separately"
    - "actual_tokens used for final efficiency calculations"
    - "no redistribution of unused tokens between methods"

# Random seeds for reproducibility (same seeds across all methods)
seeds:
  search:
    - 1
    - 2
    - 3
    - 4
    - 5
  verification:
    - 101
    - 102
    - 103

# Agent configuration (same across all methods)
agent:
  model: "mock"
  temperature: 0.7
  max_tokens: 4096
  system_prompt_version: "v1.0"
  generation_config:
    top_p: 0.9
    frequency_penalty: 0.0
    presence_penalty: 0.0

# Environment configuration
environment:
  name: "enterprise_support"
  version: "1.0"
  dataset_version: "v1.0"
  synthetic_data: true
  seed: 42

# Task configuration
tasks:
  search_split: "SEARCH"
  holdout_split: "HOLDOUT"
  search_tasks_file: "data/tasks/search_tasks.json"
  holdout_tasks_file: "data/tasks/holdout_tasks.json"
  max_tasks_per_run: null

# Adaptive selection configuration
adaptive:
  max_candidates_per_iteration: 32
  max_mutations_per_state: 8
  max_candidate_depth: 5
  selection_weights:
    novelty: 0.30
    information_gain: 0.30
    failure_probability: 0.20
    coverage: 0.10
    cost: 0.10
  minimum_rep_k: 0.75
  reproducibility_k: 3

# State branching configuration
branching:
  enabled: true
  max_snapshots_per_run: 10
  snapshot_retention: "all"
  branch_trigger:
    - "invariant_violation"
    - "policy_decision_change"
    - "state_transition_anomaly"
  max_branches_per_snapshot: 3

# Reproducibility verification configuration
reproducibility:
  verification_runs: 3
  minimum_rep_k: 0.75
  verification_seeds:
    - 101
    - 102
    - 103
  independent_seeds: true
  family_deduplication_threshold: 0.85

# Hidden holdout configuration
holdout:
  enabled: true
  tasks_file: "data/tasks/holdout_tasks.json"
  modes:
    - REPLAY
    - TRANSFER
  transfer_probe_generation:
    enabled: true
    max_probes_per_family: 2
  zero_shot_transfer:
    enabled: true
    probe_generation_strategy: "structural_transformation"

# Metamorphic testing configuration
metamorphic:
  enabled: true
  transformations:
    - FORMAT_ONLY
    - SYNTHETIC_ID_RENAME
    - IRRELEVANT_CONTEXT
    - TASK_PARAPHRASE
  consistency_threshold: 0.9

# Clustering configuration
clustering:
  algorithm: "agglomerative"
  distance_threshold: 0.85
  linkage: "average"
  min_family_size: 1
  outlier_handling: "singleton_families_allowed"

# Experiment execution control
execution:
  max_actions_per_run: 1000
  max_runs_per_method: 5  # seeds per method
  parallelism: 1
  checkpoint:
    enabled: true
    every_n_actions: 10
  resume:
    enabled: true
    max_retries: 2

# Output configuration
output:
  base_dir: "artifacts/experiments"
  export_formats:
    - "csv"
    - "jsonl"
    - "json"
  raw_data: true
  compressed: false

# Evaluation methods to run
methods:
  - STATIC
  - RANDOM
  - UNBRANCHED_ADAPTIVE
  - STATE_BRANCHED_ADAPTIVE

# Baseline configurations
baselines:
  static:
    description: "Predefined test suite, no adaptive selection"
  random:
    description: "Random candidate selection with seeded randomness"
    random_seed: 42
  unbranched_adaptive:
    description: "Adaptive selection without state branching"
  state_branched_adaptive:
    description: "Full state-branched adaptive evaluation with snapshotting and branching"

# Holdout evaluation configuration
holdout_evaluation:
  enabled: true
  modes:
    - REPLAY
    - TRANSFER
  transfer_probes_per_family: 2
  zero_shot: true
  evaluation_timing: "post_discovery_frozen"

# Metamorphic testing
metamorphic_testing:
  enabled: true
  transformations:
    - FORMAT_ONLY
    - SYNTHETIC_ID_RENAME
    - IRRELEVANT_CONTEXT
    - TASK_PARAPHRASE
  consistency_threshold: 0.9

# Clustering and family validation
family_clustering:
  algorithm: "agglomerative"
  distance_threshold: 0.85
  linkage: "average"
  min_family_size: 1
  outlier_handling: "singleton_families_allowed"

# Data exports
exports:
  formats:
    - "csv"
    - "jsonl"
    - "json"
  raw_data: true
  compressed: false
  include_raw_traces: false

# Validation rules
validation:
  pre_experiment:
    - configuration_valid
    - task_split_valid
    - holdout_inaccessible
    - budget_valid
    - strategies_available
    - model_available
    - environment_available
    - database_available
  post_search:
    all_runs_completed:
      expected: 20
    budget_accounting_valid: true
    no_holdout_access: true
    failure_artifacts_complete: true
  post_reproducibility:
    verification_runs_complete: true
    replication_records_valid: true
    family_consolidation_complete: true
  post_holdout:
    holdout_isolation_preserved: true
    family_matching_complete: true
    transfer_results_complete: true

# Integrity checks
integrity:
  seed_integrity:
    same_seeds_across_methods: true
    verification_seeds_independent: true
  budget_integrity:
    matched_budgets: true
    no_overspend: true
  holdout_integrity:
    no_leakage: true
    holdout_frozen: true
  artifact_integrity:
    no_duplicate_run_ids: true
    no_duplicate_action_ids: true
    no_duplicate_family_ids: true
    all_failures_reference_valid_traces: true
    all_families_reference_valid_failures: true

# Required raw data exports
exports:
  raw_data:
    runs_csv: true
    actions_csv: true
    failures_csv: true
    families_csv: true
    reproducibility_csv: true
    discovery_curves_csv: true
    branch_accounting_csv: true
    holdout_results_csv: true
    integrity_csv: true
  manifests:
    protocol_json: true
    config_hash: true
    manifest_json: true

# Statistics to compute (not in this phase - deferred to Phase 14)
statistics:
  metrics:
    - "AUFDC"
    - "failure_discovery_rate"
    - "reproduction_rate"
    - "holdout_transfer_rate"
    - "prefix_efficiency"
    - "redundant_test_rate"
    - "family_discovery_rate"
  confidence_intervals: false
  hypothesis_testing: false
  effect_sizes: false
  significance_testing: false

# Deferred to Phase 14
deferred_to_phase_14:
  - statistical_analysis
  - confidence_intervals
  - effect_sizes
  - hypothesis_testing
  - final_figures
  - research_conclusions
  - publication_materials