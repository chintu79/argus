services:
  api:
    build: .
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:///./data/instance/database.sqlite
    volumes are ports:
      - "8000:8000"
    volumes:
      - .:/home/app
    working_dir: /home/app
    depends_on:
      - db

  db:
    image: python:3.11-slim
    command: ["sleep", "infinity"]
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: